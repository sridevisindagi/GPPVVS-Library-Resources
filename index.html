<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>G.P. Porwal College Central Library - E-Book QR Portal</title>
  <link rel="stylesheet" href="styles.css" />
  <!-- Client-side QR code generator (no server required) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>

  <div class="main-card">
    <!-- Header -->
    <header class="card-header">
      <img src="assets/college_logo.jpg" alt="College Logo" class="college-logo" />
      <div class="header-titles">
        <h1>G.P. Porwal College Central Library</h1>
        <p class="subtitle">E-Book & QR Code Portal · Free E-Resources</p>
      </div>
    </header>

    <!-- Tab Bar -->
    <div class="tab-bar">
      <button class="tab-btn active" id="tab-search-btn" onclick="switchTab('search')">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg>
        Search Full-Text Books & PDFs
      </button>
      <button class="tab-btn" id="tab-custom-btn" onclick="switchTab('custom')">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path></svg>
        Direct Custom PDF URL
      </button>
    </div>

    <!-- Search Section -->
    <div id="search-section" class="tab-content active">
      <label for="book-query" class="input-label">Book Title or Subject Keyword:</label>
      <form id="search-form" class="input-row" onsubmit="handleSearch(event)">
        <input 
          type="text" 
          id="book-query" 
          placeholder="e.g., Physics, Calculus, Organic Chemistry, Indian History..." 
          required 
        />
        <button type="submit" class="btn-primary" id="search-btn">Search Open Archives</button>
      </form>
    </div>

    <!-- Custom URL Section -->
    <div id="custom-section" class="tab-content">
      <label for="custom-url" class="input-label">Enter PDF or E-Book Link:</label>
      <div class="input-row">
        <input 
          type="url" 
          id="custom-url" 
          placeholder="https://example.org/sample-textbook.pdf" 
        />
        <button type="button" class="btn-primary" onclick="generateCustomQR()">Create QR Code</button>
      </div>
    </div>
  </div>

  <!-- QR Modal / Popup Display -->
  <div id="qr-modal" class="modal">
    <div class="modal-card">
      <button class="close-btn" onclick="closeModal()">&times;</button>
      <div id="printable-qr-area">
        <img src="assets/college_logo.jpg" alt="Logo" class="modal-logo" />
        <h3 id="qr-modal-title">Book Title</h3>
        <p id="qr-modal-author" class="modal-sub">Author</p>
        <div id="qr-code-canvas"></div>
        <p class="scan-instructions">Scan with your mobile camera to read</p>
      </div>
      <div class="modal-actions">
        <a id="direct-read-link" href="#" target="_blank" class="btn-secondary">Open Directly</a>
        <button onclick="window.print()" class="btn-primary">Print QR Card</button>
      </div>
    </div>
  </div>

  <!-- Results Section -->
  <main class="results-container" id="results-container"></main>

  <script src="app.js"></script>
</body>
</html>
